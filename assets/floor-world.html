<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Gilded Ace · Floor lab</title><link rel="stylesheet" href="/floor-world.css"><script defer src="/floor-motion.js"></script><script defer src="/floor-world.js"></script></head>
<body>
<main id="stage" aria-label="Interactive casino floor"><svg id="floor" role="application" aria-label="Supplied casino placements; drag background to pan, wheel to zoom"><defs>
<pattern id="carpet" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#302148"/><path d="M12 2L22 12 12 22 2 12Z" fill="none" stroke="#62426d" stroke-width="2"/><rect x="10" y="10" width="4" height="4" fill="#b67b9c"/></pattern>
<pattern id="tiles" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#1b504b"/><path d="M0 0H24V24" stroke="#23635b" fill="none"/></pattern>
<filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="0" flood-color="#070d13" flood-opacity=".5"/></filter>
<g id="cabinet"><path d="M-5 -9H5V7H-5Z" fill="#121b30" stroke="currentColor" stroke-width="1.5"/><rect x="-3.5" y="-7" width="7" height="6" fill="currentColor"/><path d="M-3 -4H-1M1 -4H3" stroke="#fff1c4" stroke-width="1.5"/><path d="M-4 2H4M-3 5H3" stroke="#dfb663" stroke-width="1.5"/><rect x="-3" y="9" width="6" height="3" fill="#8c668c"/></g>
<g id="person"><rect x="-2" y="-7" width="5" height="5" fill="#ffe1b1"/><rect x="-3" y="-9" width="6" height="3" fill="#271e39"/><rect x="-3" y="-2" width="7" height="7" fill="currentColor"/><path d="M-2 5V9M3 5V9" stroke="#12212d" stroke-width="2"/></g>
</defs><g id="camera"><g id="architecture"></g><g id="slots"></g><g id="guests" aria-hidden="true"></g><g id="ghosts" aria-hidden="true"></g></g></svg></main>
<header class="brand"><span class="ace">♠</span><div><strong>THE GILDED ACE</strong><small>FLOOR LAB <span id="layoutBadge">/ PROPOSED</span></small></div><a href="http://127.0.0.1:8501/" aria-label="Return to dashboard">↗ Dashboard</a></header>
<button id="manageButton" class="manage gold" aria-haspopup="dialog">☷ Manage</button>
<button id="earningsButton" class="earnings" aria-haspopup="dialog"><small id="earningsDate">JUL 01 · EXPECTED GAMING EARNINGS</small><strong id="earningsValue">Loading…</strong></button>
<aside id="hint">Drag to move / swap · scroll to zoom <button id="dismissHint" aria-label="Dismiss floor hint">×</button></aside>
<section class="playback" aria-label="July financial playback"><button id="play" aria-label="Play July financial playback">▶ Play</button><span>JUL</span><input id="day" type="range" min="1" max="30" value="1" aria-label="Simulated July day"><output id="dayLabel">01 / 30</output></section>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="panel" class="drawer" aria-labelledby="panelTitle"><div class="panelHeading"><h2 id="panelTitle">Manage</h2><button id="closePanel" aria-label="Close panel">×</button></div><div id="panelBody"></div></dialog>
<dialog id="review" class="review" aria-labelledby="reviewTitle"><div class="panelHeading"><div><small class="eyebrow">PREVIEW ONLY</small><h2 id="reviewTitle">Review change</h2></div><button id="closeReview" aria-label="Cancel preview">×</button></div><div id="reviewBody"></div><div class="reviewActions"><button id="cancelReview">Cancel</button><button id="confirm" class="gold" disabled>Getting estimate…</button></div></dialog>
<div id="dropdown" class="dropdown" hidden><input id="dropdownSearch" type="search" placeholder="Search…" aria-label="Search choices" role="combobox" aria-controls="dropdownOptions" aria-expanded="true" autocomplete="off"><div id="dropdownOptions" role="listbox"></div></div>
</body></html>
